version: "3.9"

services:
  db:
    image: postgres:16
    container_name: safehike-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: safehike
      POSTGRES_PASSWORD: safehike123
      POSTGRES_DB: safehike
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
